name: CI

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**', 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # core/ 에 플랫폼 의존이 새어들지 않았는지 검사한다 (CLAUDE.md 1장).
  # 빌드보다 먼저, 컴파일러 없이 끝나므로 항상 돈다.
  core-purity:
    name: core/ 플랫폼 독립성 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: core/ 에서 Windows API 사용 여부
        run: |
          if [ ! -d core ]; then
            echo "core/ 가 아직 없습니다 (Phase 0 이전). 건너뜁니다."
            exit 0
          fi
          if grep -rn -i -E '(#[[:space:]]*include[[:space:]]*[<"]windows\.h)|WinHTTP|ReplaceFileW|_WIN32' core/; then
            echo "::error::core/ 는 플랫폼 독립이어야 합니다. 위 코드를 platform/ 뒤로 옮기세요 (CLAUDE.md 1장)."
            exit 1
          fi
          echo "core/ 플랫폼 독립성 확인됨."

      - name: 소스에 UTF-8 BOM 이 없는지
        run: |
          found=0
          while IFS= read -r -d '' f; do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::UTF-8 BOM 이 있습니다. BOM 없이 저장하세요."
              found=1
            fi
          done < <(find . -path ./.git -prune -o -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.json' -o -name '*.md' \) -print0)
          exit $found

  linux-core:
    name: Ubuntu (코어만)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: 빌드 대상 존재 확인
        run: |
          if [ ! -f CMakeLists.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CMakeLists.txt 가 아직 없습니다 (Phase 0 이전). 빌드를 건너뜁니다."
          fi

      # vcpkg 로 빌드하면 리눅스에서 Catch2 를 소스 빌드하느라 오래 걸린다.
      # 코어 전용 잡의 목적은 "플랫폼 의존이 새어들지 않았는가" 확인이므로 배포판 패키지로 충분하다.
      - name: 의존성 설치
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ nlohmann-json3-dev catch2

      - name: Configure
        if: steps.check.outputs.skip != 'true'
        run: cmake --preset debug-core-only

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: cmake --build --preset debug-core-only

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: ctest --preset debug-core-only --output-on-failure

  windows-full:
    name: Windows (전체)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: 빌드 대상 존재 확인
        shell: bash
        run: |
          if [ ! -f CMakeLists.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CMakeLists.txt 가 아직 없습니다 (Phase 0 이전). 빌드를 건너뜁니다."
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.check.outputs.skip != 'true'

      # 러너에 vcpkg 가 이미 설치되어 있다. vcpkg.json 매니페스트를 보고 알아서 의존성을 받는다.
      - name: Configure
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          cmake --preset debug -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: cmake --build --preset debug

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: ctest --preset debug --output-on-failure

      # ROADMAP Phase 0 완료 기준 5번의 자동화 가능한 절반.
      # 파이프로 받으므로 진짜 콘솔 렌더링은 아니지만, 프로그램이 UTF-8 바이트를 내보내는지는 확인된다.
      # 비교 문자열을 바이트로 적는 이유: 러너 셸의 인코딩에 결과가 좌우되지 않게 하려는 것.
      - name: sched --version 이 한글을 온전히 출력하는지
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          out=$(./build/debug/bin/sched.exe --version)
          echo "$out" | od -c | head -3
          echo "$out" | grep -q "$(printf '\xec\x9e\x91\xec\x97\x85')" || {
            echo "::error::--version 출력의 한글이 깨졌습니다. /utf-8 플래그나 소스 인코딩을 확인하세요."
            exit 1
          }
          echo "한글 출력 정상: $out"
